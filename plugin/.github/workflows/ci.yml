name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: No personal vault paths
        run: node scripts/check-no-personal-paths.mjs

      - name: CSS resolves without the theme
        run: node scripts/check-css-variables.mjs

      - name: Build
        run: node esbuild.config.mjs production
