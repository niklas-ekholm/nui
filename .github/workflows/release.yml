name: Release

on:
  push:
    tags:
      # Obsidian requires the tag to equal manifest.version exactly — no "v".
      - "[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Verify tag matches manifest.version
        run: |
          TAG="${GITHUB_REF_NAME}"
          MANIFEST=$(node -p "require('./manifest.json').version")
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "Tag '$TAG' does not match manifest.json version '$MANIFEST'." >&2
            exit 1
          fi
          if ! node -p "require('./versions.json')['$MANIFEST']" >/dev/null 2>&1; then
            echo "versions.json has no entry for '$MANIFEST'." >&2
            exit 1
          fi

      - name: Check
        run: |
          npm run typecheck
          npm run lint
          npm test
          node scripts/check-no-personal-paths.mjs
          node scripts/check-css-variables.mjs

      - name: Build
        run: node esbuild.config.mjs production

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            main.js manifest.json styles.css
